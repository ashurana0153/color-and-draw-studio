<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calm Colors</title>
<meta name="description" content="A color-by-number sketchbook for stress relief. Choose a fine-line picture, follow the numbers and color it by hand, at your own pace.">
<meta name="theme-color" content="#f3efe6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fcfaf5'/%3E%3Cpath d='M32 52V24M32 24C24 24 19 18 19 11c8 0 13 5 13 13zM32 34c8 0 13-6 13-13-8 0-13 5-13 13zM32 43c-6 0-10-4-10-9 6 0 10 3 10 9z' fill='none' stroke='%233f6b5a' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body data-view="gallery">

<main id="gallery" class="view">
  <div class="page">
    <header class="hero">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M32 52V24M32 24C24 24 19 18 19 11c8 0 13 5 13 13zM32 34c8 0 13-6 13-13-8 0-13 5-13 13zM32 43c-6 0-10-4-10-9 6 0 10 3 10 9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <div class="hero-text">
        <h1>Calm Colors</h1>
        <p class="lead">A color-by-number sketchbook. Choose a fine-line picture, follow the numbers and color it in by hand. No timer, no score.</p>
      </div>
      <div class="hero-stat" id="heroStat" aria-live="polite"></div>
    </header>
    <div id="cats"></div>
    <footer class="foot">Your pictures are saved on this device as you color.</footer>
  </div>
</main>

<main id="studio" class="view" data-ws="dark" hidden>
  <header class="s-top">
    <button id="back" class="link-btn" type="button"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Gallery</button>
    <div class="s-title"><span id="sCat" class="tag"></span><h2 id="sName"></h2></div>
    <div class="s-prog" aria-live="polite"><div class="bar"><i id="barFill"></i></div><b id="pct">0%</b></div>
    <div class="actions">
      <button id="undo" class="ibtn" type="button" aria-label="Undo" disabled><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 7L4 12l5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 12h9a6 6 0 010 12" transform="translate(0 -5)" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
      <span class="sep"></span>
      <button id="brushBtn" class="ibtn on" type="button" aria-label="Brush" aria-pressed="true"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20 4l-9.500 9.500" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9.500 12.500c-2.500 0-4 1.600-4 4 0 1.600-.8 2.800-2 3.500 3.500.8 7.500-.2 8-4 .3-1.800-.6-3.500-2-3.500z" fill="currentColor"/></svg></button>
      <button id="eraser" class="ibtn" type="button" aria-label="Eraser" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 16l8-9 7 6-5 6H8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 19h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
    </div>
    <div class="extras" hidden>
      <button id="guide" class="tool on" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>Guide</button>
      <button id="pan" class="tool" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8 12V6a1.5 1.5 0 013 0v5m0-1V4.500a1.500 1.500 0 013 0V11m0-3.500a1.500 1.500 0 013 0V15c0 4-2.500 6-6 6-2.700 0-4.200-1.200-5.500-3.300L4 14.500a1.500 1.500 0 012.500-1.500L8 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Move</button>
      <button id="inside" class="tool" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>In lines</button>
      <button id="reset" class="tool" type="button"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 12a8 8 0 108-8M4 4v5h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Start over</span></button>
      <button id="soundBtn" class="icon" type="button" aria-label="Sound on" aria-pressed="true"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path class="waves" d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <div class="zoomctl" role="group" aria-label="Zoom"><button id="zOut" type="button" aria-label="Zoom out"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><button id="zFit" type="button" aria-label="Fit to screen">100%</button><button id="zIn" type="button" aria-label="Zoom in"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
    </div>
  </header>

  <div class="s-main">
    <aside class="side" aria-label="Brush size">
      <i id="sizeDot" class="size-dot"></i>
      <div id="size" class="slider" role="slider" tabindex="0" aria-label="Brush size" aria-valuemin="6" aria-valuemax="48" aria-valuenow="24"><span class="track"></span><span class="fill"></span><span class="thumb"></span></div>
    </aside>

    <div class="stage" id="stage">
      <div class="paper-wrap" id="wrap">
        <div class="paper" id="paper">
          <div class="zoom" id="zoom">
            <canvas id="paint" width="1600" height="1600"></canvas>
            <div class="grain"></div>
            <canvas id="lines"></canvas>
            <canvas id="labels"></canvas>
          </div>
        </div>
        <div id="cursor" class="cursor" hidden></div>
        <div id="note" class="note" role="status" aria-live="polite" hidden></div>
      </div>
    </div>

    <aside class="colors" aria-label="Colors">
      <div class="cur"><i id="curDot"></i><span id="curName"></span></div>
      <div id="palette" class="palette" role="radiogroup" aria-label="Color palette"></div>
    </aside>
  </div>
</main>

<div id="finale" class="finale" hidden>
  <div class="finale-card" role="dialog" aria-modal="true" aria-labelledby="fTitle">
    <button id="fClose" class="icon x" type="button" aria-label="Close">&times;</button>
    <p class="eyebrow">Complete</p>
    <h2 id="fTitle">Beautifully colored</h2>
    <p id="fText" class="lead"></p>
    <img id="fPreview" alt="Your finished picture" width="240" height="240">
    <div class="finale-actions">
      <button id="fSave" class="btn" type="button">Save as image</button>
      <button id="fNext" class="btn primary" type="button">Next picture</button>
    </div>
    <button id="fGallery" class="link" type="button">Back to the gallery</button>
  </div>
</div>

<script type="module" src="js/main.js?v=7"></script>
</body>
</html>
