<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calm Colors</title>
<meta name="description" content="A color-by-number sketchbook for stress relief. Choose a fine-line picture, follow the numbers and color it by hand, at your own pace.">
<meta name="theme-color" content="#f3efe6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fcfaf5'/%3E%3Cpath d='M32 52V24M32 24C24 24 19 18 19 11c8 0 13 5 13 13zM32 34c8 0 13-6 13-13-8 0-13 5-13 13zM32 43c-6 0-10-4-10-9 6 0 10 3 10 9z' fill='none' stroke='%233f6b5a' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body data-view="gallery">

<main id="gallery" class="view">
  <div class="page">
    <header class="hero">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M32 52V24M32 24C24 24 19 18 19 11c8 0 13 5 13 13zM32 34c8 0 13-6 13-13-8 0-13 5-13 13zM32 43c-6 0-10-4-10-9 6 0 10 3 10 9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <div class="hero-text">
        <h1>Calm Colors</h1>
        <p class="lead">A color-by-number sketchbook. Choose a fine-line picture, follow the numbers and color it in by hand. No timer, no score.</p>
      </div>
      <div class="hero-stat" id="heroStat" aria-live="polite"></div>
    </header>
    <div id="cats"></div>
    <footer class="foot">Your pictures are saved on this device as you color.</footer>
  </div>
</main>

<main id="studio" class="view" hidden>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="gBarrel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f1f1f3"/><stop offset="1" stop-color="#d9d9dd"/></linearGradient>
    <linearGradient id="gFerrule" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f4f6"/><stop offset=".5" stop-color="#bfc0c5"/><stop offset="1" stop-color="#e3e3e7"/></linearGradient>
  </defs></svg>
  <header class="s-top">
    <button id="back" class="nav" type="button"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/></svg>Gallery</button>
    <h2 id="sName"></h2>
    <span id="sCat" class="sr"></span>
    <div class="s-right"><span class="s-prog" aria-live="polite"><span class="bar"><i id="barFill"></i></span><b id="pct">0%</b></span><button id="done" class="nav strong" type="button">Done</button></div>
  </header>

  <div class="s-main">
    <div class="stage" id="stage">
      <div class="paper-wrap" id="wrap">
        <div class="paper" id="paper">
          <div class="zoom" id="zoom">
            <canvas id="paint" width="1600" height="1600"></canvas>
            <div class="grain"></div>
            <canvas id="lines"></canvas>
            <canvas id="labels"></canvas>
          </div>
        </div>
        <div id="cursor" class="cursor" hidden></div>
        <div id="note" class="note" role="status" aria-live="polite" hidden></div>
      </div>
    </div>

    <aside class="toolbar" id="toolbar" aria-label="Drawing tools">
      <div class="tb-pill">
        <div class="tb-hist"><button id="undo" class="circ" type="button" aria-label="Undo" disabled><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 4L4 9l5 5M4 9h9.500a5.500 5.500 0 010 11H10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="redo" class="circ" type="button" aria-label="Redo" disabled><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 4l5 5-5 5M20 9h-9.500a5.500 5.500 0 000 11H14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
        <div class="tb-tools" id="sizes" role="radiogroup" aria-label="Tools">
          <button type="button" class="tool-i" data-size="8" role="radio" aria-label="Fine brush"><svg viewBox="0 0 150 40" width="112" height="30" aria-hidden="true"><rect x="0" y="11" width="86" height="18" rx="3" fill="url(#gBarrel)"/><rect x="0" y="11" width="86" height="18" rx="3" fill="none" stroke="rgba(0,0,0,.08)"/><path d="M58 14v12" stroke="#2b2b2d" stroke-width="1.6" stroke-linecap="round"/><rect x="84" y="12" width="20" height="16" rx="2" fill="url(#gFerrule)"/><path d="M90 12v16M96 12v16" stroke="rgba(0,0,0,.18)"/><path d="M104 17.500C114 16.800 128 18.800 142 20C128 21.200 114 23.200 104 22.500Z" style="fill:var(--c,#444)"/></svg></button>
          <button type="button" class="tool-i on" data-size="20" role="radio" aria-label="Medium brush"><svg viewBox="0 0 150 40" width="112" height="30" aria-hidden="true"><rect x="0" y="11" width="86" height="18" rx="3" fill="url(#gBarrel)"/><rect x="0" y="11" width="86" height="18" rx="3" fill="none" stroke="rgba(0,0,0,.08)"/><path d="M58 14v12" stroke="#2b2b2d" stroke-width="1.6" stroke-linecap="round"/><path d="M63 14v12" stroke="#2b2b2d" stroke-width="1.6" stroke-linecap="round"/><rect x="84" y="12" width="20" height="16" rx="2" fill="url(#gFerrule)"/><path d="M90 12v16M96 12v16" stroke="rgba(0,0,0,.18)"/><path d="M104 14.500C116 13.500 130 17 144 20C130 23 116 26.500 104 25.500Z" style="fill:var(--c,#444)"/></svg></button>
          <button type="button" class="tool-i" data-size="44" role="radio" aria-label="Broad brush"><svg viewBox="0 0 150 40" width="112" height="30" aria-hidden="true"><rect x="0" y="11" width="86" height="18" rx="3" fill="url(#gBarrel)"/><rect x="0" y="11" width="86" height="18" rx="3" fill="none" stroke="rgba(0,0,0,.08)"/><path d="M58 14v12" stroke="#2b2b2d" stroke-width="1.6" stroke-linecap="round"/><path d="M63 14v12" stroke="#2b2b2d" stroke-width="1.6" stroke-linecap="round"/><path d="M68 14v12" stroke="#2b2b2d" stroke-width="1.6" stroke-linecap="round"/><rect x="84" y="12" width="20" height="16" rx="2" fill="url(#gFerrule)"/><path d="M90 12v16M96 12v16" stroke="rgba(0,0,0,.18)"/><path d="M104 11.500C118 10.500 132 15 141 20C132 25 118 29.500 104 28.500Z" style="fill:var(--c,#444)"/></svg></button>
          <button id="eraser" type="button" class="tool-i" role="radio" aria-label="Eraser" aria-pressed="false"><svg viewBox="0 0 150 40" width="112" height="30" aria-hidden="true"><rect x="0" y="11" width="104" height="18" rx="3" fill="url(#gBarrel)"/><rect x="0" y="11" width="104" height="18" rx="3" fill="none" stroke="rgba(0,0,0,.08)"/><path d="M80 16l7 8M87 16l-7 8" stroke="#ee8a84" stroke-width="1.8" stroke-linecap="round"/><rect x="102" y="11" width="30" height="18" rx="7" fill="#f3a39d"/></svg></button>
        </div>
        <div id="palette" class="palette" role="radiogroup" aria-label="Colors"></div>
        <button id="moreBtn" class="circ" type="button" aria-label="More" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="5" cy="12" r="1.700" fill="currentColor"/><circle cx="12" cy="12" r="1.700" fill="currentColor"/><circle cx="19" cy="12" r="1.700" fill="currentColor"/></svg></button>
      </div>
      <div id="more" class="menu" role="menu" hidden>
        <button id="guide" type="button" class="on" aria-pressed="true"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg><span>Highlight sections</span></button>
        <button id="inside" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg><span>Stay in lines</span></button>
        <button id="pan" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M8 12V6a1.5 1.5 0 013 0v5m0-1V4.500a1.500 1.500 0 013 0V11m0-3.500a1.500 1.500 0 013 0V15c0 4-2.500 6-6 6-2.700 0-4.200-1.200-5.500-3.300L4 14.500a1.500 1.500 0 012.500-1.500L8 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Move canvas</span></button>
        <div class="zoomctl" role="group" aria-label="Zoom"><button id="zOut" type="button" aria-label="Zoom out"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><button id="zFit" type="button" aria-label="Fit to screen">100%</button><button id="zIn" type="button" aria-label="Zoom in"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
        <button id="soundBtn" type="button" aria-label="Sound on" aria-pressed="true"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path class="waves" d="M16 8.500a5 5 0 010 7M18.500 6a8.500 8.500 0 010 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Sound</span></button>
        <button id="reset" type="button" class="danger"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 12a8 8 0 108-8M4 4v5h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Start over</span></button>
      </div>
    </aside>
  </div>
</main>

<div id="finale" class="finale" hidden>
  <div class="finale-card" role="dialog" aria-modal="true" aria-labelledby="fTitle">
    <button id="fClose" class="icon x" type="button" aria-label="Close">&times;</button>
    <p class="eyebrow">Complete</p>
    <h2 id="fTitle">Beautifully colored</h2>
    <p id="fText" class="lead"></p>
    <img id="fPreview" alt="Your finished picture" width="240" height="240">
    <div class="finale-actions">
      <button id="fSave" class="btn" type="button">Save as image</button>
      <button id="fNext" class="btn primary" type="button">Next picture</button>
    </div>
    <button id="fGallery" class="link" type="button">Back to the gallery</button>
  </div>
</div>

<script type="module" src="js/main.js?v=8"></script>
</body>
</html>
