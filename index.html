<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calm Colors</title>
<meta name="description" content="A color-by-number sketchbook for stress relief. Choose a fine-line picture, follow the numbers and color it by hand, at your own pace.">
<meta name="theme-color" content="#f3efe6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fcfaf5'/%3E%3Cpath d='M32 52V24M32 24C24 24 19 18 19 11c8 0 13 5 13 13zM32 34c8 0 13-6 13-13-8 0-13 5-13 13zM32 43c-6 0-10-4-10-9 6 0 10 3 10 9z' fill='none' stroke='%233f6b5a' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body data-view="gallery">

<main id="gallery" class="view">
  <div class="page">
    <header class="hero">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M32 52V24M32 24C24 24 19 18 19 11c8 0 13 5 13 13zM32 34c8 0 13-6 13-13-8 0-13 5-13 13zM32 43c-6 0-10-4-10-9 6 0 10 3 10 9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <div class="hero-text">
        <h1>Calm Colors</h1>
        <p class="lead">A color-by-number sketchbook. Choose a fine-line picture, follow the numbers and color it in by hand. No timer, no score.</p>
      </div>
      <div class="hero-stat" id="heroStat" aria-live="polite"></div>
    </header>
    <div id="cats"></div>
    <footer class="foot">Your pictures are saved on this device as you color.</footer>
  </div>
</main>

<main id="studio" class="view" hidden>
  <header class="s-top">
    <button id="back" class="pill" type="button"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Gallery</button>
    <div class="s-title"><span id="sCat" class="tag"></span><h2 id="sName"></h2></div>
    <div class="s-prog" aria-live="polite"><div class="bar"><i id="barFill"></i></div><b id="pct">0%</b></div>
    <button id="soundBtn" class="icon" type="button" aria-label="Sound on" aria-pressed="true">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path class="waves" d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </header>

  <div class="s-main">
    <div class="sheet-wrap">
      <div class="sheet">
        <div class="paper-wrap" id="wrap">
          <div class="paper" id="paper">
            <div class="zoom" id="zoom">
              <canvas id="paint" width="1600" height="1600"></canvas>
              <div class="grain"></div>
              <canvas id="lines"></canvas>
              <canvas id="labels"></canvas>
            </div>
          </div>
          <div id="cursor" class="cursor" hidden></div>
          <div id="note" class="note" role="status" aria-live="polite" hidden></div>
        </div>
        <div class="sheet-foot">
          <span class="sheet-hint">Zoom in for the tiny sections</span>
          <div class="zoomctl" role="group" aria-label="Zoom">
            <button id="zOut" type="button" aria-label="Zoom out"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
            <button id="zFit" type="button" aria-label="Fit to screen">100%</button>
            <button id="zIn" type="button" aria-label="Zoom in"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          </div>
        </div>
      </div>
    </div>

    <aside class="tray">
      <div class="tray-head"><h3>Paint pots</h3><span class="hint">Match the number</span></div>
      <div id="palette" class="palette" role="radiogroup" aria-label="Color palette"></div>

      <div class="tools">
        <div class="tool-row">
          <span class="lbl">Brushes</span>
          <div class="seg" id="sizes" role="radiogroup" aria-label="Brush size">
            <button type="button" data-size="6" role="radio" aria-label="Fine brush"><svg viewBox="0 0 24 40" width="22" height="36" aria-hidden="true"><rect x="10.5" y="1" width="3" height="17" rx="1.5" fill="#b08a5e"/><rect x="9.5" y="18" width="5" height="6" rx="1" fill="#9aa09c"/><path d="M10.4 24H13.6Q13.6 33 12 38Q10.4 33 10.4 24Z" fill="currentColor"/></svg></button>
            <button type="button" data-size="12" role="radio" aria-label="Small brush"><svg viewBox="0 0 24 40" width="22" height="36" aria-hidden="true"><rect x="10.5" y="1" width="3" height="17" rx="1.5" fill="#b08a5e"/><rect x="9.5" y="18" width="5" height="6" rx="1" fill="#9aa09c"/><path d="M9.4 24H14.6Q14.6 33 12 38Q9.4 33 9.4 24Z" fill="currentColor"/></svg></button>
            <button type="button" data-size="24" role="radio" aria-label="Medium brush" class="on"><svg viewBox="0 0 24 40" width="22" height="36" aria-hidden="true"><rect x="10.5" y="1" width="3" height="17" rx="1.5" fill="#b08a5e"/><rect x="9.5" y="18" width="5" height="6" rx="1" fill="#9aa09c"/><path d="M8.2 24H15.8Q15.8 33 12 38Q8.2 33 8.2 24Z" fill="currentColor"/></svg></button>
            <button type="button" data-size="44" role="radio" aria-label="Large brush"><svg viewBox="0 0 24 40" width="22" height="36" aria-hidden="true"><rect x="10.5" y="1" width="3" height="17" rx="1.5" fill="#b08a5e"/><rect x="9.5" y="18" width="5" height="6" rx="1" fill="#9aa09c"/><path d="M6.8 24H17.2Q17.2 33 12 38Q6.8 33 6.8 24Z" fill="currentColor"/></svg></button>
          </div>
        </div>
        <div class="tool-grid">
          <button id="eraser" class="tool" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 16l8-9 7 6-5 6H8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 19h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>Eraser</button>
          <button id="undo" class="tool" type="button" disabled><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 7L4 12l5 5M4 12h10a6 6 0 010 12" transform="translate(0 -4)" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Undo</button>
          <button id="guide" class="tool on" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>Guide</button>
          <button id="pan" class="tool" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M8 12V6a1.5 1.5 0 013 0v5m0-1V4.500a1.500 1.500 0 013 0V11m0-3.500a1.500 1.500 0 013 0V15c0 4-2.500 6-6 6-2.700 0-4.200-1.200-5.500-3.300L4 14.500a1.500 1.500 0 012.500-1.500L8 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Move</button>
          <button id="inside" class="tool" type="button" aria-pressed="false" title="Optional: strokes stop at the edge of the section you start in"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>In lines</button>
          <button id="reset" class="tool" type="button"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 12a8 8 0 108-8M4 4v5h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Start over</span></button>
        </div>
      </div>
    </aside>
  </div>
</main>

<div id="finale" class="finale" hidden>
  <div class="finale-card" role="dialog" aria-modal="true" aria-labelledby="fTitle">
    <button id="fClose" class="icon x" type="button" aria-label="Close">&times;</button>
    <p class="eyebrow">Complete</p>
    <h2 id="fTitle">Beautifully colored</h2>
    <p id="fText" class="lead"></p>
    <img id="fPreview" alt="Your finished picture" width="240" height="240">
    <div class="finale-actions">
      <button id="fSave" class="btn" type="button">Save as image</button>
      <button id="fNext" class="btn primary" type="button">Next picture</button>
    </div>
    <button id="fGallery" class="link" type="button">Back to the gallery</button>
  </div>
</div>

<script type="module" src="js/main.js?v=5"></script>
</body>
</html>
