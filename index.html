<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calm Colors</title>
<meta name="description" content="A color-by-number sketchbook for stress relief. Pick a picture, match the numbers and paint it with a brush, at your own pace.">
<meta name="theme-color" content="#efe5d3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fffdf8'/%3E%3Ccircle cx='24' cy='26' r='9' fill='%23f2a31f'/%3E%3Ccircle cx='40' cy='26' r='9' fill='%23e0679a'/%3E%3Ccircle cx='32' cy='41' r='9' fill='%232f8f83'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" defer></script>
</head>
<body data-view="gallery">

<main id="gallery" class="view">
  <div class="page">
    <header class="hero">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="6" width="52" height="52" rx="12" fill="#fffdf8" stroke="#2f2b35" stroke-width="2.4"/><circle cx="24" cy="26" r="9" fill="#f2a31f" stroke="#2f2b35" stroke-width="2"/><circle cx="40" cy="26" r="9" fill="#e0679a" stroke="#2f2b35" stroke-width="2"/><circle cx="32" cy="41" r="9" fill="#2f8f83" stroke="#2f2b35" stroke-width="2"/></svg>
      <div class="hero-text">
        <h1>Calm Colors</h1>
        <p class="lead">A color-by-number sketchbook. Pick a picture, match the numbers, and paint it with your brush. No timer, no score, just colors.</p>
      </div>
      <div class="hero-stat" id="heroStat" aria-live="polite"></div>
    </header>
    <div id="cats"></div>
    <footer class="foot">Your pictures are saved on this device as you paint.</footer>
  </div>
</main>

<main id="studio" class="view" hidden>
  <header class="s-top">
    <button id="back" class="pill" type="button"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Gallery</button>
    <div class="s-title"><span id="sCat" class="tag"></span><h2 id="sName"></h2></div>
    <div class="s-prog" aria-live="polite"><div class="bar"><i id="barFill"></i></div><b id="pct">0%</b></div>
    <button id="soundBtn" class="icon" type="button" aria-label="Sound on" aria-pressed="true">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path class="waves" d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <div class="s-main">
    <div class="sheet-wrap">
      <div class="sheet">
        <i class="tape t1"></i><i class="tape t2"></i>
        <div class="paper-wrap" id="wrap">
          <div class="paper" id="paper">
            <div class="zoom" id="zoom">
              <canvas id="paint" width="800" height="800"></canvas>
              <div class="grain"></div>
              <canvas id="lines"></canvas>
              <canvas id="labels"></canvas>
            </div>
          </div>
          <div id="cursor" class="cursor" hidden></div>
          <div id="note" class="note" role="status" aria-live="polite" hidden></div>
        </div>
        <div class="zoomctl" role="group" aria-label="Zoom">
          <button id="zOut" type="button" aria-label="Zoom out"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
          <button id="zFit" type="button" aria-label="Fit to screen">100%</button>
          <button id="zIn" type="button" aria-label="Zoom in"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
        </div>
      </div>
    </div>

    <aside class="tray">
      <div class="tray-head"><h3>Colors</h3><span class="hint">Match the number</span></div>
      <div id="palette" class="palette" role="radiogroup" aria-label="Color palette"></div>

      <div class="tools">
        <div class="tool-row">
          <span class="lbl">Brush</span>
          <div class="seg" id="sizes" role="radiogroup" aria-label="Brush size">
            <button type="button" data-size="12" role="radio" aria-label="Small brush"><i style="--d:8px"></i></button>
            <button type="button" data-size="24" role="radio" aria-label="Medium brush" class="on"><i style="--d:14px"></i></button>
            <button type="button" data-size="44" role="radio" aria-label="Large brush"><i style="--d:22px"></i></button>
          </div>
        </div>
        <div class="tool-grid">
          <button id="eraser" class="tool" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 16l8-9 7 6-5 6H8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10 19h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Eraser</button>
          <button id="undo" class="tool" type="button" disabled><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 7L4 12l5 5M4 12h10a6 6 0 010 12" transform="translate(0 -4)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Undo</button>
          <button id="guide" class="tool on" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>Guide</button>
          <button id="pan" class="tool" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M8 12V6a1.5 1.5 0 013 0v5m0-1V4.500a1.500 1.500 0 013 0V11m0-3.500a1.500 1.500 0 013 0V15c0 4-2.500 6-6 6-2.700 0-4.200-1.200-5.500-3.300L4 14.500a1.500 1.500 0 012.500-1.500L8 15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Move</button>
          <button id="inside" class="tool on" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>In lines</button>
          <button id="reset" class="tool" type="button"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 12a8 8 0 108-8M4 4v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Start over</span></button>
        </div>
      </div>
    </aside>
  </div>
</main>

<div id="finale" class="finale" hidden>
  <div class="finale-card" role="dialog" aria-modal="true" aria-labelledby="fTitle">
    <button id="fClose" class="icon x" type="button" aria-label="Close">&times;</button>
    <p class="hand">all done</p>
    <h2 id="fTitle">Beautifully colored</h2>
    <p id="fText" class="lead"></p>
    <img id="fPreview" alt="Your finished picture" width="240" height="240">
    <div class="finale-actions">
      <button id="fSave" class="btn" type="button">Save as image</button>
      <button id="fNext" class="btn primary" type="button">Next picture</button>
    </div>
    <button id="fGallery" class="link" type="button">Back to the gallery</button>
  </div>
</div>

<script type="module" src="js/main.js?v=3"></script>
</body>
</html>
